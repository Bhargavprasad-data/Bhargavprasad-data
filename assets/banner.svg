<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="45%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#050a16"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Base background -->
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Subtle technical grid -->
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.35"/>

  <!-- Drifting glow spot -->
  <circle cx="600" cy="150" r="260" fill="url(#glowSpot)">
    <animate attributeName="cx" values="420;780;420" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner frame marks (technical/terminal aesthetic) -->
  <path d="M28 24 L28 44 M28 24 L48 24" stroke="#334155" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M1172 24 L1172 44 M1172 24 L1152 24" stroke="#334155" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M28 336 L28 316 M28 336 L48 336" stroke="#334155" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M1172 336 L1172 316 M1172 336 L1152 336" stroke="#334155" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Floating particles -->
  <g fill="#22d3ee">
    <circle cx="95" cy="70" r="2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="260" r="2.5" fill="#818cf8">
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="90" r="2.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="250" r="2">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="6.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="300" r="1.8" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="40" r="1.6" fill="#38bdf8">
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="5.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated flowing lines beneath the title -->
  <path d="M120 250 Q 360 205 600 240 T 1080 220" stroke="url(#accent)" stroke-width="1.6" fill="none" opacity="0.45" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M120 262 Q 360 300 600 268 T 1080 288" stroke="url(#accent)" stroke-width="1" fill="none" opacity="0.25" stroke-dasharray="4 8">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Name -->
  <text x="600" y="140" text-anchor="middle" fill="url(#textFade)"
        font-family="'JetBrains Mono', 'Segoe UI', Consolas, monospace"
        font-size="56" font-weight="700" letter-spacing="4">
    BHARGAV PRASAD
  </text>

  <!-- Subtitle -->
  <text x="600" y="182" text-anchor="middle" fill="#94a3b8"
        font-family="'JetBrains Mono', 'Segoe UI', Consolas, monospace"
        font-size="18" letter-spacing="3">
    SOFTWARE ENGINEER &#8226; FULL STACK DEVELOPER
  </text>

  <!-- Accent underline with glow pulse -->
  <line x1="470" y1="204" x2="730" y2="204" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
  </line>

  <!-- Terminal decoration -->
  <g transform="translate(390,282)">
    <rect x="0" y="0" width="420" height="42" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" fill="#ef4444" opacity="0.75"/>
    <circle cx="33" cy="14" r="4" fill="#eab308" opacity="0.75"/>
    <circle cx="48" cy="14" r="4" fill="#22c55e" opacity="0.75"/>
    <text x="20" y="32" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="1">
      &gt; BUILDING &#8226; LEARNING &#8226; SOLVING
    </text>
    <rect x="352" y="20" width="8" height="14" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
