<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="360" height="548" role="img" aria-label="Bhargav Prasad swinging ID badge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bhargav Prasad — Software Engineer ID badge</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes settle{0%{transform:rotate(0deg) translateY(-640px)}20%{transform:rotate(0deg) translateY(0)}34%{transform:rotate(11deg)}50%{transform:rotate(-8deg)}66%{transform:rotate(5deg)}82%{transform:rotate(-3deg)}94%{transform:rotate(1deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
@keyframes wob{0%,100%{transform:rotate(1.3deg)}50%{transform:rotate(-1.3deg)}}
@keyframes shine{0%{transform:translateX(-320px) skewX(-18deg)}55%,100%{transform:translateX(400px) skewX(-18deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.settle{transform-origin:210px 6px;animation:settle 3.2s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.4s ease-in-out 3.2s infinite}
.wob{transform-origin:210px 300px;animation:wob 4.4s ease-in-out 3.2s infinite}
.shine{animation:shine 4.8s ease-in-out 3.4s infinite}
.blink{animation:blink 1s step-end infinite}
]]></style>
<linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#0ea5e9"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0ea5e9"/>
</linearGradient>
<linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0b1120"/><stop offset="55%" stop-color="#0a0f1f"/><stop offset="100%" stop-color="#050a16"/>
</linearGradient>
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="#22d3ee;#60a5fa;#a78bfa;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#a78bfa;#22d3ee;#60a5fa;#a78bfa" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#cbd5e1"/><stop offset="45%" stop-color="#8a94a6"/><stop offset="55%" stop-color="#6b7686"/><stop offset="100%" stop-color="#9aa5b6"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glow"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<clipPath id="cardclip"><rect x="82" y="290" width="256" height="320" rx="18"/></clipPath>
<g clip-path="url(#avatarclip)">
  <image
    href="profile.jpg"
    x="154"
    y="344"
    width="112"
    height="108"
    preserveAspectRatio="xMidYMid slice"
  />
</g>
</defs>

<circle cx="210" cy="430" r="220" fill="url(#glow)"/>

<g class="settle"><g class="sway">
  <path d="M191 -6 L229 -6 L226 232 L194 232 Z" fill="url(#strap)"/>
  <line x1="196" y1="0" x2="198" y2="230" stroke="#fff" stroke-opacity=".5" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="222" y1="0" x2="220" y2="230" stroke="#fff" stroke-opacity=".5" stroke-width="1" stroke-dasharray="4 3"/>

  <g class="wob">
    <rect x="176" y="222" width="68" height="34" rx="8" fill="url(#clip)"/>
    <circle cx="210" cy="239" r="7" fill="#0b1120"/>

    <g filter="none">
      <rect x="76" y="284" width="268" height="332" rx="22" fill="url(#cardborder)"/>
      <rect x="82" y="290" width="256" height="320" rx="18" fill="url(#cardbg)"/>

      <g clip-path="url(#cardclip)">
        <rect x="82" y="290" width="256" height="70" fill="#0e1a2e"/>
        <text x="210" y="316" text-anchor="middle" fill="#22d3ee" font-size="11" letter-spacing="3">SOFTWARE ENGINEER</text>
        <text x="210" y="336" text-anchor="middle" fill="#64748b" font-size="9" letter-spacing="2">ACCESS: FULL STACK</text>

        <circle cx="210" cy="398" r="56" fill="#0b1120" stroke="#22d3ee" stroke-width="1.5"/>
        <g clip-path="url(#avatarclip)">
          <rect x="154" y="344" width="112" height="108" fill="#0f172a"/>
          <circle cx="210" cy="386" r="22" fill="#334155"/>
          <path d="M170 452 Q210 412 250 452 L250 452 L170 452 Z" fill="#334155"/>
        </g>

        <text x="210" y="478" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" letter-spacing="1">BHARGAV PRASAD</text>
        <text x="210" y="500" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1">B.TECH CSE &#183; MVGR &#183; 2027</text>

        <line x1="106" y1="516" x2="314" y2="516" stroke="#1e293b" stroke-width="1"/>

        <text x="106" y="538" fill="#64748b" font-size="9" letter-spacing="1">STACK</text>
        <text x="106" y="556" fill="#cbd5e1" font-size="10">React &#183; Node.js &#183; Python</text>
        <text x="106" y="572" fill="#cbd5e1" font-size="10">PostgreSQL &#183; MongoDB</text>

        <circle cx="106" cy="592" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="118" y="596" fill="#22c55e" font-size="10" letter-spacing="1">OPEN TO OPPORTUNITIES</text>
      </g>

      <rect x="76" y="284" width="268" height="332" rx="22" fill="none" stroke="url(#cardborder)" stroke-width="2"/>

      <g clip-path="url(#cardclip)">
        <rect class="shine" x="0" y="284" width="90" height="332" fill="url(#shineg)"/>
      </g>
    </g>
  </g>
</g></g>

</svg>
